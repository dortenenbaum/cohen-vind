<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 63" width="63" height="63" role="img" aria-label="כהן וינד ושות׳">
  <title>Cohen Vind &amp; Co. — negative mark</title>
  <desc>The mark as a white knockout on transparency, for photography, film and any dark ground. Each band's opacity is its own contrast against paper in the positive, so the two read as the same mark — same layers, same order, same spacing. The bands overlap, so each is masked against the ones painted after it: without that the overlaps composite and the mark renders eight greys instead of the five it is drawn in.</desc>
