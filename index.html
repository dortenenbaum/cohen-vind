<title>כהן וינד ושות׳</title>

<link rel="preload" as="font" type="font/otf" href="assets/fonts/SimplerPro_V3-Regular.otf" crossorigin>
<style>
/* ============================================================
   Cohen Vind & Co. — every value below is read off the Figma
   file (Section 2): type sizes, tracking, line-heights, radii,
   paddings, gaps and the colour variables of the Vind library.
   ============================================================ */

@font-face{font-family:"SimplerPro_V3";src:url("assets/fonts/SimplerPro_V3-Light.otf") format("opentype");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"SimplerPro_V3";src:url("assets/fonts/SimplerPro_V3-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"SimplerPro_V3";src:url("assets/fonts/SimplerPro_V3-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}

:root{
  /* ------------------------------------------------------------------
     White ground. The neutrals are neutral — no warm bias in any
     surface or rule — and the only warmth left on the page is the
     terracotta that marks what you can act on, and the clay the map
     markers are drawn in.
     ------------------------------------------------------------------ */
  --paper:#ffffff;          /* the ground                            */
  --paper-hi:#f7f7f6;       /* the quieter band between white ones   */
  --paper-2:#f2f2f1;        /* a raised surface on the ground        */
  --ink:#242424;            /* text and drawn edges                  */
  --accent:#c9512e;         /* PRIMARY — buttons, links, live state  */
  --accent-tint:#f7e6df;    /* its wash                              */
  --marker:#7a3a20;         /* clay — map pins and the icon avatars  */
  --marker-tint:#e8dbd1;    /* matches the exported SVG assets       */
  --accent-ink:#ffffff;
  --walnut:#6b6b6b;         /* secondary text and small labels       */
  --sand:#dededc;           /* hairlines                             */

  /* Figma library names, repointed at the paper system, so every rule
     in the sheet restyles without being touched. */
  --vind-light-b:var(--paper-2);
  --vind-light:#f2f2f1;
  --vind-medium:#dededc;
  --vind-dark:var(--ink);
  --vind-10:#fafafa;        /* was used twice but never defined */
  --vind-20:#ededec;
  --vind-40:#d8d8d6;
  --vind-60:#bcbcba;
  --vind-80:#767674;
  --vind-text:#242424;
  --white:#ffffff;
  --ground:var(--paper);

  /* layout — 1920 breakpoint, 1740 content, 90px gutters */
  --maxw:clamp(1740px,90.625vw,2200px);
  --gutter:clamp(16px,4.6875vw,116px);
  --hdr-h:91px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --cw:min(var(--maxw), 100vw - 2*var(--gutter));

  /* type — exact Figma values at 1920, scaled fluidly below it */
  --t-hero:clamp(34px,3.6458vw,88px);      /* 70 / 1.0  /   —   / Light  */
  --t-display:clamp(27px,2.3958vw,58px);   /* 46 / 1.2 / -0.46 / Light  */
  --t-title:clamp(22px,1.9271vw,46px);     /* 37 / 1.2 /  0.74 / Light  */
  --t-ui:clamp(15px,1.0417vw,25px);        /* 20 / norm /  0.40 / Reg   */
  --t-body:clamp(14px,0.9375vw,22px);      /* 18 / 1.4  /  0.54 / Reg   */
  --t-micro:clamp(13px,0.9375vw,22px);     /* 18 / norm /  0.36 / Reg   */
  --t-badge:clamp(11px,0.625vw,15px);      /* 12 / 1.2                  */

  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-settle:cubic-bezier(.76,0,.24,1);
  color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;direction:rtl;background:var(--ground);color:var(--vind-text);
  font-family:"SimplerPro_V3","Assistant","Arial Hebrew",system-ui,sans-serif;
  font-weight:400;font-size:var(--t-body);line-height:1.4;letter-spacing:.54px;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--vind-dark);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}

/* ---------- type roles ---------- */
.t-hero{font-weight:300;font-size:var(--t-hero);line-height:1;letter-spacing:0;color:var(--vind-text);margin:0}
.t-display{font-weight:300;font-size:var(--t-display);line-height:1.2;letter-spacing:-.46px;color:var(--vind-text);margin:0}
.t-title{font-weight:300;font-size:var(--t-title);line-height:1.2;letter-spacing:.74px;color:var(--vind-text);margin:0}
.t-ui{font-weight:400;font-size:var(--t-ui);line-height:normal;letter-spacing:.4px}
.t-body{font-weight:400;font-size:var(--t-body);line-height:1.4;letter-spacing:.54px;margin:0}
.t-micro{font-weight:400;font-size:var(--t-micro);line-height:normal;letter-spacing:.36px}
.dim{color:var(--vind-80)}
.meas{max-width:1149px}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:60;background:var(--ground);
  transition:background .5s var(--ease)}

/* ---- header over the film ------------------------------------------
   While the opener is still uncovered the bar has no ground of its own
   and everything on it turns white. The logo mark steps aside rather
   than being forced into white — it is five tones of terrain, and a
   flat silhouette would throw that away — and returns when the bar
   gets its ground back.
   -------------------------------------------------------------------- */
/* two marks in one slot: the positive, and the white knockout that
   reads over film. Cross-fading them beats filtering one into the
   other — five tones of terrain do not survive being flattened. */
.brand-lockup{position:relative;width:63px;height:63px;flex:none}
.brand-mark,.brand-neg{position:absolute;inset:0;width:100%;height:100%;display:block;
  transition:opacity .42s var(--ease)}
/* the knockout has to hold over a pale sky as well as a dark facade */
.brand-neg{opacity:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.brand-txt,.lang button,.burger,.burger i{
  transition:color .5s var(--ease),background .5s var(--ease),box-shadow .5s var(--ease)}

body.hdr-clear .hdr{background:transparent}
body.hdr-clear .brand-mark{opacity:0}
body.hdr-clear .brand-neg{opacity:1}
body.hdr-clear .brand-txt{color:#fff}
body.hdr-clear .brand-txt span{color:rgba(255,255,255,.72)}
body.hdr-clear .lang button{color:rgba(255,255,255,.72)}
body.hdr-clear .lang button[aria-pressed="true"]{color:#fff;border-bottom-color:#fff}
body.hdr-clear .lang span{color:rgba(255,255,255,.45)}
body.hdr-clear .burger{color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
/* an open menu always needs its own ground */
/* the drawer brings its own ground, so the bar stays as the film left
   it — lighting it up mid-open was a flash of the wrong colour */
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:var(--hdr-h)}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{width:63px;height:63px;flex:none;display:block}
.brand-txt{font-weight:700;font-size:var(--t-micro);line-height:18px;letter-spacing:.36px;color:var(--vind-text)}
.brand-txt span{display:block;color:var(--vind-60)}
.hdr-left{display:flex;align-items:center;gap:20px;flex-direction:row-reverse}
/* A bare glyph, not a button: three 1px rules in a 20x13 box, drawn in
   currentColor so the header's existing over-the-film logic keeps driving
   it. The 44px pseudo-element is the tap target the visible mark is too
   small to provide. */
.burger{width:26px;height:17px;position:relative;background:none;border:0;padding:0;
  color:var(--vind-text);cursor:pointer;
  transition:opacity var(--ease) .2s}
.burger:hover{opacity:.6}
.burger:before{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}
.burger i{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:currentColor;
  transition:transform .4s var(--ease),opacity .25s var(--ease),width .3s var(--ease)}
.burger i:nth-child(1){top:0}
.burger i:nth-child(2){top:7.5px;width:68%}
.burger i:nth-child(3){top:15px}
.burger:hover i:nth-child(2){width:100%}
.burger[aria-expanded="true"] i:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0;width:0}
.burger[aria-expanded="true"] i:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.lang{display:flex;align-items:center;gap:5px;color:var(--vind-80)}
.lang button{padding-bottom:3px}
.lang button[aria-pressed="true"]{color:var(--vind-text);border-bottom:1.5px solid var(--vind-dark);
  transition:color .5s var(--ease),border-color .5s var(--ease)}

/* ---------- menu ---------- */
/* A drawer off the left edge rather than a full-screen takeover: a
   translucent warm panel over a heavy backdrop blur, so the page stays
   legible behind it. Left, not the reading side — it opens from under the
   burger, which sits on the left in this header. */
.menu-backdrop{position:fixed;inset:0;z-index:98;background:rgba(22,17,13,.15);
  opacity:0;visibility:hidden;
  transition:opacity .5s var(--ease-rv),visibility 0s .5s}
.menu-backdrop.open{opacity:1;visibility:visible;
  transition:opacity .5s var(--ease-rv),visibility 0s}

.menu{position:fixed;top:0;bottom:0;left:0;z-index:99;
  width:min(420px,86vw);padding:120px 56px 56px;
  display:flex;flex-direction:column;
  background:rgba(246,242,235,.5);
  -webkit-backdrop-filter:blur(26px) saturate(125%) brightness(1.1);
  backdrop-filter:blur(26px) saturate(125%) brightness(1.1);
  color:var(--vind-text);
  box-shadow:0 0 60px rgba(22,17,13,0);
  transform:translateX(-100%);
  transition:transform .6s var(--ease-settle),box-shadow .6s var(--ease-settle)}
.menu.open{transform:translateX(0);box-shadow:0 0 60px rgba(22,17,13,.18)}
/* without backdrop-filter the panel has to carry its own ground */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .menu{background:rgba(246,242,235,.94)}
}
.menu-label{font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:var(--walnut);margin:0 0 36px}
.menu-in{display:flex;flex-direction:column;flex:1;min-height:0}
.menu nav{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.menu nav a{position:relative;display:block;text-align:start;text-decoration:none;
  font-family:var(--font-display,inherit);font-weight:300;
  font-size:clamp(22px,2.6vw,28px);line-height:1.15;letter-spacing:-.01em;
  color:var(--vind-text);padding-block:7px;
  transition:opacity .4s var(--ease),transform .5s var(--ease-settle);
  animation:navIn .42s var(--ease) backwards;animation-delay:calc(var(--i) * 45ms)}
@keyframes navIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.menu nav a .ar{display:none}
.menu nav a:hover{opacity:.6;transform:translateX(-8px)}
.menu nav a[aria-current="page"]{opacity:1}
/* the current page is marked by a rule in the margin, not a colour */
.menu nav a[aria-current="page"]:before{content:"";position:absolute;top:50%;
  inset-inline-start:-20px;width:10px;height:1px;background:var(--walnut)}
.menu-side{margin-top:auto;padding-top:40px;display:flex;flex-direction:column;gap:6px;
  animation:navIn .5s var(--ease) backwards;animation-delay:.2s}
.menu-contact{display:flex;flex-direction:column;gap:6px}
.menu-contact a{font-size:13px;font-weight:300;color:var(--vind-text);text-decoration:none;
  width:fit-content;transition:color .4s var(--ease)}
.menu-contact a:hover{color:var(--walnut)}
.menu-contact span{font-size:11px;font-weight:300;letter-spacing:.08em;
  text-transform:uppercase;color:var(--walnut)}
/* close control, mirroring the reference's two crossed rules */
.menu-close{position:absolute;top:clamp(24px,4vh,40px);inset-inline-end:clamp(24px,5vw,40px);
  width:32px;height:32px;background:none;border:0;cursor:pointer;z-index:1}
.menu-close:before{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}
.menu-close span{position:absolute;top:50%;left:3px;display:block;width:26px;height:2px;
  border-radius:2px;background:var(--ink);transform:rotate(45deg);transition:background .3s var(--ease)}
.menu-close span:after{content:"";position:absolute;display:block;width:26px;height:2px;
  border-radius:2px;background:var(--ink);transform:rotate(-90deg)}
.menu-close:hover span,.menu-close:hover span:after{background:var(--vind-text)}

.menu-contact{display:grid;gap:6px;margin-top:18px;color:var(--vind-80)}
.menu-contact a:hover{color:var(--vind-dark)}

/* ---------- link button (arrow + underline) ---------- */
.link-btn{display:inline-flex;align-items:center;gap:14px;flex-direction:row-reverse;width:max-content;
  padding-bottom:10px;border-bottom:1px solid var(--vind-40);color:var(--vind-text);
  transition:border-color .2s var(--ease),color .2s var(--ease),gap .2s var(--ease)}
.link-btn svg{width:19px;height:12px;flex:none;transition:transform .25s var(--ease)}
.link-btn:hover{color:var(--accent);border-color:var(--accent);gap:20px}
.link-btn:hover svg{transform:translateX(-4px)}

/* ---------- home ---------- */
/* the statement that meets you off the film — centred, and at the
   largest size the page owns */
.intro{padding-block:clamp(90px,13vh,190px) clamp(60px,8vh,120px);
  display:grid;gap:clamp(28px,3.4vh,48px);justify-items:center;text-align:center}
.intro .meas{max-width:32ch;font-size:var(--t-hero);line-height:1.08;font-weight:300;
  text-wrap:balance}
/* ---- the opener ----------------------------------------------------
   The film fills the first screen and then stays exactly where it is.
   Everything after it is opaque and sits one layer up, so scrolling
   draws the page over the film like a curtain rather than pushing it
   off the top. Sticky, not fixed — the film keeps its place in flow,
   so the router can swap the page without leaving a ghost behind.
   -------------------------------------------------------------------- */
.opener{position:sticky;top:0;height:100svh;margin-block-start:calc(-1 * var(--hdr-h));
  z-index:0;overflow:hidden;background:var(--ink)}
/* The reference keeps its hero permanently in slow motion — 45s from
   scale(1) to scale(1.2), linear, alternating, so it breathes in and back
   out over a minute and a half and never settles. Ours plays a film that
   then holds its closing frame, and this is what keeps that frame alive.
   It sits on a wrapper because the film's own transform is written inline
   by the parallax on every scroll frame. */
.opener-zoom{position:absolute;inset:0;animation:opener-zoom 45s linear infinite alternate}
@keyframes opener-zoom{from{transform:scale(1)}to{transform:scale(1.2)}}
.opener-film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform:scale(1.16);transform-origin:100% 100%;will-change:transform}
.opener-scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(16,15,13,.80) 0%,rgba(16,15,13,.46) 30%,rgba(16,15,13,.12) 58%,rgba(16,15,13,0) 78%),
             linear-gradient(to bottom,rgba(16,15,13,.52) 0%,rgba(16,15,13,.12) 16%,rgba(16,15,13,0) 30%)}
.opener-txt{position:absolute;inset-inline:0;
  inset-block-end:calc(clamp(30px,5.4vh,74px) + env(safe-area-inset-bottom,0px));
  color:#fff;will-change:transform,opacity}
.opener-claim{font-weight:300;font-size:var(--t-hero);line-height:1.02;color:#fff;margin:0}
.opener-lede{min-width:0}
/* the practice's name, set small over the film — the same wording the
   header lockup carries, as type rather than the mark */
.opener-kicker{font-weight:400;font-size:var(--t-micro);line-height:1.4;letter-spacing:.36px;
  color:rgba(255,255,255,.72);margin:0 0 10px}

/* the claim keeps the reading side, the scroll cue takes the empty left
   corner. Source order puts the claim first so it still reads first; in
   RTL flex that lands it on the right and the cue on the left. */
.opener-row{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
/* Three chevrons stacked on the same spot, each starting 300ms after the
   last, so the cue reads as a run of arrows falling rather than one
   blinking. overflow stays visible: the travel is longer than the box and
   clipping it cuts the glyph in half at the end of each pass. */
.opener-scroll{flex:none;position:relative;width:20px;height:40px;padding:0;border:0;
  background:none;color:#fff;cursor:pointer;overflow:visible}
.opener-scroll svg{position:absolute;inset-inline-start:0;top:0;display:block;
  width:20px;height:15.2px;animation:opener-arrow 2s linear infinite}
.opener-scroll svg:nth-of-type(2){animation-delay:.3s}
.opener-scroll svg:nth-of-type(3){animation-delay:.6s}
/* the chevron drifts down through its own box, fading in and back out */
@keyframes opener-arrow{
  0%  {opacity:0;transform:translateY(0);animation-timing-function:ease-in-out}
  50% {opacity:1;animation-timing-function:ease-in-out}
  100%{opacity:0;transform:translateY(40px);animation-timing-function:ease-in-out}
}

/* the layer that climbs over the film */
.over{position:relative;z-index:1;background:var(--paper)}

@media (max-width:760px){
  /* the floating contact buttons sit in the bottom corner on the reading
     side; at phone gutters the title runs straight into them */
  .opener-txt{inset-block-end:calc(118px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){
  .opener-txt{transform:none!important;opacity:1!important}
  .opener-scroll svg{animation:none;opacity:1}
  .opener-zoom{animation:none}
  .opener-film{transform:scale(1.16)!important}
}
.sec{padding-block:80px}
.sec-head{display:grid;justify-items:start;gap:18px;margin-bottom:40px}
.sec-head.mid{justify-items:center;text-align:center}
/* ---- bands ----------------------------------------------------------
   The page alternates between the warm ground and a clean white, so the
   beige reads as a choice rather than as the only option there is.
   Bands are full-bleed: .wrap caps at --maxw, and a background on it
   alone would leave the ground showing down both margins on a wide
   screen.
   --------------------------------------------------------------------- */
.strip{position:relative}
.strip-hi{background:var(--paper-hi)}

/* the office, between what the practice says and what it believes */
.shopfront{position:relative;width:100%;
  height:clamp(300px,42vw,760px);overflow:hidden;background:var(--vind-20)}
.shopfront img{width:100%;height:100%;object-fit:cover;display:block}

/* ---- the vision set -------------------------------------------------
   Read as a sheet of drawings rather than three cards: each cell is
   ruled off top and bottom, labelled and numbered like a detail on a
   plan, and carries an isometric study of what the words claim. The
   millimetre grid and the corner registration marks come up under the
   cell you are reading.
   --------------------------------------------------------------------- */
.values{display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch;
  border-top:1px dashed var(--sand);margin-top:clamp(28px,3.4vh,50px)}
.vcell{display:flex;flex-direction:column;position:relative;
  border-inline-start:1px dashed var(--sand);padding:0}
.vcell:first-child{border-inline-start:0}


.vcell-art{position:relative;aspect-ratio:1/.94;overflow:hidden;
  border-bottom:1px dashed var(--sand);display:grid;place-items:center}
.vcell-grid{position:absolute;inset:0;opacity:0;transition:opacity .45s var(--ease);
  background-image:linear-gradient(to right,var(--sand) 1px,transparent 1px),
                   linear-gradient(to bottom,var(--sand) 1px,transparent 1px);
  background-size:clamp(26px,2.4vw,40px) clamp(26px,2.4vw,40px);
  background-position:center center}
.vx{position:absolute;width:11px;height:11px;opacity:0;transition:opacity .45s var(--ease)}
.vx::before,.vx::after{content:"";position:absolute;background:var(--walnut)}
.vx::before{inset-block:0;inset-inline-start:5px;width:1px}
.vx::after{inset-inline:0;inset-block-start:5px;height:1px}
.vx.tl{top:14px;left:14px} .vx.tr{top:14px;right:14px}
.vx.bl{bottom:14px;left:14px} .vx.br{bottom:14px;right:14px}

.iso{position:relative;z-index:1;width:82%;height:auto;display:block;overflow:visible}
.iso path{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso .g-ground{stroke:var(--vind-40);stroke-width:1}
.iso .g-ghost {stroke:var(--vind-60);stroke-width:1;stroke-dasharray:8 4}
.iso .g-edge  {stroke:var(--ink);stroke-width:1.4}
.iso .g-ring  {stroke:var(--vind-60);stroke-width:1}
.iso .g-mark  {fill:var(--accent);stroke:none;opacity:0;transition:opacity .35s var(--ease)}

.vcell:hover .vcell-grid{opacity:.5}
.vcell:hover .vx{opacity:.85}

.vcell:hover .iso .g-mark{opacity:1}
.vcell:hover .iso .g-edge{stroke:var(--ink)}
.iso .g-edge{transition:stroke .4s var(--ease)}

.vcell-body{padding:clamp(20px,2vw,30px) clamp(14px,1.3vw,22px) 0}
.vcell-body h3{margin:0 0 .5em}

@media (max-width:900px){
  .values{grid-template-columns:1fr}
  .vcell{border-inline-start:0;border-bottom:1px dashed var(--sand)}
  .vcell-art{aspect-ratio:1/.6}
}
/* the practice draws plans — so do its icons: one stroke weight, one accent */
.rule{height:1px;background:var(--vind-20)}

/* selected-projects carousel: right-aligned track that bleeds off the left page edge */
.crsl{position:relative}
.cbtn{position:absolute;top:0;width:20%;z-index:6;border:0;background:none;
  padding:0 30px;direction:ltr;
  color:#fff;display:flex;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease-in-out}
.cbtn svg{width:39px;height:21px;filter:drop-shadow(0 1.5px .75px rgba(0,0,0,.8))}
.crsl:hover .cbtn,.cbtn:focus-visible{opacity:1;pointer-events:auto}
.cbtn[disabled]{opacity:0!important;pointer-events:none}
.cbtn.prev{right:calc(var(--gutter) * -1);justify-content:flex-end}
.cbtn.prev svg{transform:scaleX(-1)}
.cbtn.next{left:calc(var(--gutter) * -1);justify-content:flex-start}
@media (hover:none){.cbtn{opacity:1;pointer-events:auto}}
/* One slide holds the middle of the frame with both neighbours showing at
   the edges. The side padding is whatever is left over once the slide has
   taken its share, so the first and last cards centre like the rest; the
   numbers live in that margin, turned on their end, which is why what you
   read in the peek zones are the neighbours' numbers. */
/* The side padding and the slide width have to agree, and a percentage on
   the slide would resolve against the box the padding just shrank. So the
   padding alone sets the peek and the slide simply fills what is left:
   10% either side leaves a slide 80% of the rail, the reference's ratio. */
.crsl{--csl-peek:10%;--csl-gap:30px}
.carousel{display:flex;gap:var(--csl-gap);overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;
  padding-inline:var(--csl-peek);padding-bottom:4px;
  margin-inline:calc(var(--gutter) * -1)}
.carousel::-webkit-scrollbar{display:none}
.carousel.dragging{cursor:grabbing;scroll-snap-type:none}
.crsl .cslide{flex:none;width:100%;scroll-snap-align:center;display:block;position:relative;
  padding-inline:38px}
.csl-num{position:absolute;inset-inline-start:4px;top:2px;bottom:auto;height:auto;
  writing-mode:vertical-rl;direction:ltr;font-size:16px;line-height:1;letter-spacing:.04em;
  color:var(--sand);white-space:nowrap;transition:color .35s var(--ease)}
.cslide:hover .csl-num{color:var(--accent)}
.cslide .shot{overflow:hidden;background:var(--vind-20);position:relative}
/* Hovering brings the drawing up: it lifts and clears, a hairline
   closes around it, and the markers rise off the bottom edge. */
.cslide .shot::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  border:1px solid rgba(255,255,255,0);transition:border-color .55s var(--ease)}
.cslide:hover .shot::after{border-color:rgba(255,255,255,.55)}
.shot-tags{position:absolute;inset-inline:0;bottom:0;z-index:3;pointer-events:none;
  padding:clamp(28px,4vw,56px) clamp(14px,1.6vw,26px) clamp(12px,1.4vw,20px);
  background:linear-gradient(to top,rgba(24,18,13,.72) 0%,rgba(24,18,13,.34) 52%,rgba(24,18,13,0) 100%);
  opacity:0;transform:translateY(10px);
  transition:opacity .45s var(--ease),transform .55s var(--ease)}
.cslide:hover .shot-tags,.cslide:focus-visible .shot-tags{opacity:1;transform:none}
.shot-tags .attr{color:#fff}
.shot-tags img.icoimg,.shot-tags .ico{width:26px;height:26px;flex:none}
.shot-tags .attrs{gap:6px clamp(12px,1.2vw,20px)}
.crsl .shot{aspect-ratio:847/466}
.cslide .shot>img{width:100%;height:100%;object-fit:cover;
  filter:saturate(.88);transition:transform 1.1s var(--ease),filter .7s var(--ease)}
.cslide:hover .shot>img{transform:scale(1.055);filter:saturate(1)}
.cslide .meta{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:18px}
/* the title block is shared by the cards and the carousel; only the
   carousel centres, and centring it here quietly centred the grid too */
.titles{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:100%}
.cslide .titles{align-items:center;text-align:center}
.cslide h3{margin:0}
.cslide .place{font-weight:300;font-size:var(--t-display);line-height:1.2;letter-spacing:-.46px;color:var(--vind-80)}

/* careers runs as an ambient ticker — full-bleed, no controls, nothing clickable */
.ticker{overflow:hidden;margin-inline:calc(var(--gutter) * -1);pointer-events:none;direction:ltr}
.ticker-track{display:flex;gap:30px;width:max-content;animation:tick 56s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}
.ticker .cslide{direction:rtl;margin:0}
.cslide.career{width:calc(var(--cw) * .46897)}
.cslide.career .shot{height:calc(var(--cw) * .31264)}
.cslide.career figcaption{margin-top:14px;color:var(--vind-80)}
.careers-foot{display:grid;justify-items:start;gap:20px;margin-top:40px}

/* ---------- attribute rows (label + 25.6px avatar) ---------- */
.attrs{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:flex-start}
.attr{display:flex;align-items:center;gap:8px}
/* same two tones as the exported pin and icon-avatar assets, so a
   drawn marker and a placed one are indistinguishable */
.ico{width:25.6px;height:25.6px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--marker-tint);border:1px solid var(--marker);color:var(--marker)}
.ico.off{background:var(--vind-40);border-color:var(--vind-80);color:var(--vind-80)}
.ico svg{width:12px;height:12px}
img.icoimg{width:25.6px;height:25.6px;flex:none;display:block;object-fit:contain;aspect-ratio:1}
img.icoimg.big{width:32px;height:32px}
.pchip img.icoimg{width:28px;height:28px}
.opt img.icoimg{width:26px;height:26px}
.ico{line-height:1}
.ico.lt{font-weight:700;font-size:14px;letter-spacing:0;line-height:1;font-family:inherit}
.ico.big{width:32px;height:32px}
.ico.big svg{width:15px;height:15px}
.ico.big.lt{font-size:17px}

/* ---------- projects toolbar ---------- */
.plan-bar{display:flex;flex-wrap:wrap;gap:10px;padding-block:20px 16px}
/* One toolbar, one control: a hairline pill on the ground. State is
   carried by fill, never by a heavier line — a bar that answers every
   press with more weight ends up shouting in five places at once. */
.plan{display:inline-flex;align-items:center;gap:8px;background:transparent;
  border:1px solid var(--sand);border-radius:999px;padding:9px 16px;color:var(--walnut);
  transition:border-color .22s var(--ease),color .22s var(--ease),background .22s var(--ease)}
.plan:hover{border-color:var(--walnut);color:var(--vind-text)}
.plan[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent-tint);
  color:var(--accent)}
.badge{height:20px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 8px;border-radius:999px;box-sizing:border-box;
  background:transparent;border:1px solid var(--sand);color:var(--walnut);
  font-size:var(--t-badge);line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums}
.badge.on{background:var(--walnut);border-color:var(--walnut);color:var(--paper)}

.tool-rule{height:1px;background:var(--vind-20)}
.tools{display:flex;flex-wrap:wrap-reverse;align-items:center;justify-content:space-between;gap:14px 24px;padding-block:16px 20px}
.tool-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.count{display:inline-flex;align-items:center;gap:10px;margin-inline-end:6px;color:var(--vind-text)}

.chip{position:relative;display:inline-flex;align-items:center;gap:8px;height:36px;padding:6px 14px;
  border:1px solid var(--sand);border-radius:999px;background:transparent;color:var(--walnut);
  transition:border-color .22s var(--ease),background .22s var(--ease),color .22s var(--ease)}
.chip svg{width:16px;height:16px;color:currentColor;opacity:.85}
.chip:hover{border-color:var(--walnut);color:var(--vind-text)}
.chip.on{background:var(--accent-tint);border-color:var(--accent-tint);color:var(--accent)}
.chip .x{font-size:1.05em;line-height:1;opacity:.8}
.chip .cnt{font-size:var(--t-badge);background:var(--accent);color:var(--accent-ink);border-radius:999px;
  min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;
  padding-inline:5px;letter-spacing:0;line-height:1;font-variant-numeric:tabular-nums}
.reset{color:var(--vind-80);border-bottom:1px solid var(--vind-40);padding-bottom:2px}
.reset:hover{color:var(--vind-dark);border-color:var(--vind-dark)}

.pop{position:absolute;top:calc(100% + 8px);inset-inline-start:0;z-index:40;min-width:292px;
  background:var(--white);border:1px solid var(--vind-20);border-radius:10px;padding:8px;
  box-shadow:0 18px 44px -18px rgba(45,55,25,.34);display:none}
.pop.open{display:block;animation:popIn .18s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:6px;text-align:start;transition:background .15s var(--ease)}
.opt:hover{background:var(--vind-10)}
.opt .lbl{flex:1}
.opt .box{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--vind-40);flex:none;display:grid;place-items:center;color:transparent}
.opt[aria-checked="true"] .box{background:var(--vind-dark);border-color:var(--vind-dark);color:var(--vind-light)}
.opt .box svg{width:12px;height:12px}

.views{display:flex;gap:10px}
.view-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:6px 16px;border-radius:999px;
  border:1px solid var(--sand);background:transparent;color:var(--walnut);
  transition:background .22s var(--ease),border-color .22s var(--ease),color .22s var(--ease)}
.view-btn svg{width:16px;height:16px}
.view-btn:hover{border-color:var(--walnut);color:var(--vind-text)}
.view-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.view-btn[aria-pressed="true"]:hover{color:#fff}

/* ---------- results ---------- */
.results{padding-bottom:80px;min-height:420px}
.fade{animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* gallery — 4 columns of 412.5, 30px column gap, 80px row gap, top aligned */
.grid{display:grid;grid-template-columns:repeat(4,1fr);column-gap:30px;row-gap:80px;align-items:start}
.card{display:block}
.card .shot{overflow:hidden;background:var(--vind-20)}
.card .shot img{width:100%;object-fit:cover;transition:transform .6s var(--ease)}
.card .shot img.wide{aspect-ratio:412/274}
.card .shot img.tall{aspect-ratio:413/548}
.card:hover .shot img{transform:scale(1.04)}
.card .meta{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:10px}
.card h3{margin:0}
.card .place{font-weight:300;font-size:var(--t-title);line-height:1.06;letter-spacing:.74px;color:var(--vind-80)}
.card .titles h3{line-height:1.06}
.card .titles .ln{padding-bottom:.12em;margin-bottom:-.12em}
.card:hover h3{color:var(--vind-dark)}

/* list */
.tablewrap{overflow:visible}

/* ---- projects index ------------------------------------------------
   Five columns on a shared grid so the header and every row share one
   set of tracks. Rules are hairlines; the only hover feedback is the
   row dimming and the picture that rides the cursor.
   -------------------------------------------------------------------- */
.windex{position:relative;margin-top:clamp(40px,6vh,64px)}
.windex-head,.windex-row{display:grid;grid-template-columns:80px 1fr 1fr 96px 88px;gap:24px}
.windex-head{padding:0 0 20px;border-bottom:.5px solid var(--sand)}
.windex-head span{font-size:clamp(10px,.573vw,11px);font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--walnut);text-align:start}
.windex-head .sortable{cursor:pointer;transition:color .3s var(--ease)}
.windex-head .sortable:hover{color:var(--vind-text)}
.windex-row{padding:26px 0;border-bottom:.5px solid var(--sand);text-decoration:none;
  color:inherit;transition:opacity .3s var(--ease)}
.windex-row:hover{opacity:.7}
.windex-row:focus-visible{outline:2px solid var(--vind-text);outline-offset:-2px}
.wx-year{font-size:clamp(13px,.729vw,14px);font-weight:300;letter-spacing:.04em;color:var(--walnut)}
.wx-title{font-size:clamp(15px,.833vw,16px);font-weight:400;letter-spacing:.02em;color:var(--vind-text)}
.wx-place{font-size:clamp(13px,.729vw,14px);font-weight:300;letter-spacing:.02em;color:var(--vind-text)}
.wx-type{font-size:clamp(11px,.625vw,12px);font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--walnut)}
.wx-size{text-align:end}
/* the last two columns carry the marker rather than its name — the same
   avatars the cards and the map use, so one glance reads across all
   three views. The name is still there, on hover and to a reader. */
.wx-type,.wx-size{display:flex;align-items:center}
.wx-size{justify-content:flex-end}
.wx-ico{position:relative;display:inline-flex;align-items:center;justify-content:center}
.wx-ico img.icoimg,.wx-ico .ico{width:27px;height:27px}
.wx-ico::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;
  transform:translate(-50%,5px);background:var(--ink);color:var(--paper);
  font-size:11px;letter-spacing:.02em;line-height:1;white-space:nowrap;
  padding:6px 10px;border-radius:7px;opacity:0;pointer-events:none;z-index:14;
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
.wx-ico:hover::after{opacity:1;transform:translate(-50%,0)}
/* the preview rides the pointer; it is never in the way, so it takes no events */
.windex-preview{position:absolute;top:0;left:0;z-index:10;width:280px;height:180px;
  overflow:hidden;pointer-events:none;visibility:hidden;opacity:0;
  transition:opacity .3s var(--ease)}
.windex-preview.tall{width:203px;height:360px}
.windex-preview.on{visibility:visible;opacity:1}
.windex-preview img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:900px){
  .windex-head,.windex-row{grid-template-columns:60px 1fr 1fr 120px;gap:16px}
  .wx-size{display:none}
  .windex-preview{display:none}
}
@media (prefers-reduced-motion:reduce){ .windex-preview{display:none} }
table{width:100%;border-collapse:collapse;table-layout:auto}
thead th{background:var(--vind-light);color:var(--vind-dark);font-weight:400;text-align:start;
  height:50px;padding:0 16px;white-space:nowrap;border-bottom:.5px solid var(--vind-dark);
  font-size:var(--t-body);line-height:1.2;letter-spacing:-.18px}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{background:var(--vind-medium)}
tbody td{height:80px;padding:0 16px;border-bottom:.5px solid rgba(0,0,0,.55);color:#000;
  font-size:var(--t-body);line-height:1.2;letter-spacing:-.18px;vertical-align:middle}
tbody tr{transition:background .15s var(--ease);cursor:pointer}
tbody tr:hover{background:var(--white)}
tbody tr:focus-visible{outline:2px solid var(--vind-dark);outline-offset:-2px}
td.year,td.units{font-variant-numeric:tabular-nums;white-space:nowrap}
td.client{color:var(--vind-text);max-width:360px}
td.go>span{display:inline-flex;align-items:center;gap:8px;flex-direction:row-reverse;color:var(--vind-dark);
  border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .15s var(--ease)}
tbody tr:hover td.go>span{border-color:var(--vind-dark)}
td.go svg{width:17px;height:11px}
.status{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--vind-60);flex:none}
.status.approved i{background:var(--accent)}
.status.building i{background:var(--vind-dark)}
.status.done i{background:var(--vind-80)}

.tt{position:relative;display:inline-flex}
.tt::after{content:attr(data-tt);position:absolute;top:calc(100% + 8px);inset-inline-start:50%;
  transform:translateX(50%) translateY(-4px);background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:0;
  padding:5px 9px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .16s var(--ease),transform .16s var(--ease);z-index:30}
.tt:hover::after,.tt:focus-visible::after{opacity:1;transform:translateX(50%) translateY(0)}

/* ---------- map ---------- */
.mapbox{position:relative;overflow:hidden;background:#e9ecef;touch-action:none;
  aspect-ratio:1738/1080;display:flex;align-items:center}
.mapstage{position:relative;width:122.3%;margin-inline:-11.15%;flex:none;
  aspect-ratio:1738/883;transform-origin:center;
  transition:transform .46s cubic-bezier(.4,0,.2,1);cursor:grab}
.mapstage.dragging{transition:none;cursor:grabbing}
.mapstage>img.base{width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
#gmap{position:absolute;inset:0;z-index:3}
.mapnote{position:absolute;bottom:16px;left:16px;z-index:8;background:rgba(255,255,255,.94);
  border:1px solid var(--vind-20);border-radius:999px;padding:7px 14px;color:var(--vind-80);
  font-size:13px;letter-spacing:0;box-shadow:0 4px 14px -8px rgba(0,0,0,.4);
  transition:color .18s var(--ease),border-color .18s var(--ease)}
.mapnote:hover{color:var(--vind-dark);border-color:var(--vind-medium)}
.pin{position:absolute;transform:translate(-50%,-100%) scale(var(--pz,1));transform-origin:50% 100%;
  z-index:2;line-height:0;transition:filter .18s var(--ease),transform .18s var(--ease)}
.pin{animation:pinPop .3s var(--ease) both}
@keyframes pinPop{from{opacity:0}to{opacity:1}}
.pin .cpin{display:block;height:clamp(26px,calc(var(--cw) * .02474),43px);width:auto;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.pin .cpin text{font-family:"SimplerPro_V3",sans-serif;font-weight:700;fill:#7A3A20}
.pin img{height:clamp(26px,calc(var(--cw) * .02474),43px);width:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.pin:hover,.pin.sel{z-index:6;transform:translate(-50%,-100%) scale(calc(var(--pz,1) * 1.16))}
.mapzoom{position:absolute;bottom:16px;right:16px;display:flex;gap:8px;z-index:8}
.mapzoom button{width:40px;height:40px;border-radius:8px;background:var(--vind-light-b);color:var(--vind-dark);
  display:grid;place-items:center;font-size:20px;line-height:1;box-shadow:0 4px 12px -4px rgba(0,0,0,.3)}
.mapzoom button:hover{background:var(--vind-medium)}
/* the drawer owns the frame while it is open */
.mapbox.panel-open .mapzoom{opacity:.35;pointer-events:none}
.mapzoom{transition:opacity .3s var(--ease)}
.mapsearch{position:absolute;top:14px;right:14px;z-index:8;width:38px;height:38px;border-radius:7px;
  background:var(--white);display:grid;place-items:center;box-shadow:0 4px 12px -5px rgba(0,0,0,.3)}
.mapsearch svg{width:16px;height:16px;color:var(--vind-80)}
.mappanel{position:absolute;top:0;right:0;height:100%;width:33.43%;min-width:300px;max-width:581px;z-index:10;
  background:rgba(255,255,255,.86);backdrop-filter:blur(3px);overflow:hidden;
  animation:panelIn .42s cubic-bezier(.22,.61,.36,1);
  --pt:clamp(22px,calc(var(--cw) * .02414),42px);
  --pp:clamp(15px,calc(var(--cw) * .01264),22px);
  --pc:clamp(12px,calc(var(--cw) * .0092),16px);
  --pb:clamp(12px,calc(var(--cw) * .00805),14px)}
@keyframes panelIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes panelOut{from{transform:none}to{transform:translateX(100%)}}
.mappanel.closing{animation:panelOut .36s cubic-bezier(.55,0,.7,.2) forwards;pointer-events:none}
.mappanel img.shot{width:100%;aspect-ratio:396/224;object-fit:cover;display:block;background:var(--vind-20)}
.pinner>.rv-img{flex:none;width:100%}
/* direction:ltr on the scroller puts the bar on the right of an RTL page;
   the inner wrapper flips the content back */
.pscroll{height:100%;overflow-y:auto;overscroll-behavior:contain;direction:ltr;
  scrollbar-width:thin;scrollbar-color:var(--vind-60) transparent}
.pscroll::-webkit-scrollbar{width:6px}
.pscroll::-webkit-scrollbar-track{background:transparent}
.pscroll::-webkit-scrollbar-thumb{background:var(--vind-60);border-radius:3px}
.pinner{direction:rtl;display:flex;flex-direction:column;align-items:flex-start;gap:16px;
  padding:calc(var(--cw) * .046) calc(var(--cw) * .023) 28px}
.mappanel .head{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%}
.mappanel h4{margin:0;font-weight:400;font-size:var(--pt);line-height:1.2;letter-spacing:0;color:var(--vind-text);text-align:right}
.mappanel .place{font-weight:400;font-size:var(--pp);letter-spacing:.44px;color:var(--vind-dark)}
.pchips{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:flex-start;width:100%}
.pchip{display:flex;align-items:center;gap:6px;font-size:var(--pc);letter-spacing:.32px;color:var(--vind-dark)}
.pchip .ico{width:28px;height:28px;border-width:.875px}
.pchip .ico svg{width:14px;height:14px}
.pchip .ico.lt{font-size:16px}
.pspecs{display:flex;flex-direction:column;gap:4px;width:100%}
.pspecs div{border-bottom:1px solid var(--vind-dark);font-size:var(--pb);line-height:24px;color:var(--vind-dark);text-align:right;padding-bottom:2px}
.pspecs b{font-weight:700}
.pdesc{margin:0;font-size:var(--pb);line-height:20px;color:var(--vind-dark);text-align:right;width:100%}
.pclose{position:absolute;top:0;right:0;width:40px;height:40px;z-index:4;background:var(--vind-dark);color:var(--vind-light);
  display:grid;place-items:center;font-size:19px;line-height:1;z-index:2;transition:background .18s var(--ease)}
.pclose:hover{background:var(--accent)}
.pcta{display:inline-flex;align-items:center;gap:50px;flex-direction:row-reverse;height:41px;padding:4px 14px;

.empty{padding:80px 0;text-align:center;color:var(--vind-80)}

/* ---------- footer ---------- */
.ft-in{display:flex;flex-wrap:wrap-reverse;align-items:center;justify-content:space-between;gap:18px 32px;padding-block:22px}
.ft-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;line-height:26px}

.bands div:nth-child(2){height:92px;background:var(--vind-60)}

.floats{position:fixed;inset-inline-start:14px;inset-block-end:22px;z-index:50;display:grid;gap:10px}

/* ============================================================
   Motion layer — entrance only. Nothing here changes layout,
   colour or type; every rule resolves to the page's resting
   state, so the page is correct with JS off or motion reduced.
   ============================================================ */
:root{--ease-rv:cubic-bezier(.16,1,.3,1);--rv-t:.92s;--rv-step:70ms}

.ln{display:block;overflow:hidden;padding-bottom:.09em;margin-bottom:-.09em}
.ln>i{display:block;font-style:inherit;font-weight:inherit;letter-spacing:inherit}
.rv-img{position:relative;overflow:hidden}
.rv-img::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:var(--vind-light-b);transform:scaleY(0);transform-origin:top}

@media (prefers-reduced-motion:no-preference){
  .hdr{opacity:1}
  body.booting .hdr{opacity:0}
  body.booted .hdr{transition:opacity .55s cubic-bezier(.4,0,.2,1)}

  /* above the fold on first paint: no colour block, images just resolve
     into the space already reserved for them */
  .rv.soft.rv-pre .rv-img::after{transform:scaleY(0)}
  .rv.soft.rv-pre .rv-img>img,.rv.soft.rv-pre.rv-img>img,
  .rv.soft.rv-pre .rv-img>video,.rv.soft.rv-pre.rv-img>video{opacity:0}
  .rv.soft.rv-in .rv-img>img,.rv.soft.rv-in.rv-img>img,
  .rv.soft.rv-in .rv-img>video,.rv.soft.rv-in.rv-img>video{opacity:1;
    transition:opacity .8s cubic-bezier(.4,0,.2,1);transition-delay:.22s}
  .rv.soft.rv-in .ln>i{transition-duration:.85s;transition-timing-function:cubic-bezier(.4,0,.2,1)}
  .rv.soft.rv-in .rv-i{transition-duration:.8s;transition-timing-function:cubic-bezier(.4,0,.2,1)}

  .rv-pre .ln>i{transform:translateY(108%)}
  .rv-in  .ln>i{transform:translateY(0);
    transition:transform var(--rv-t) var(--ease-rv);
    transition-delay:calc(var(--li,0) * var(--rv-step))}

  .rv-pre .rv-i{opacity:0;transform:translateY(16px)}
  .rv-in  .rv-i{opacity:1;transform:none;
    transition:opacity .72s var(--ease-rv),transform .72s var(--ease-rv);
    transition-delay:calc(var(--li,0) * var(--rv-step) + 90ms)}

  .rv-pre .rv-img::after{transform:scaleY(1);transform-origin:bottom}
  .rv-pre .value-rule{transform:scaleX(0)}
  .rv-in  .value-rule{transform:scaleX(1);transition:transform .95s var(--ease-rv) .1s}
  .rv-in  .rv-img::after{transform:scaleY(0);transform-origin:top;
    transition:transform .82s var(--ease-rv);
    transition-delay:calc(var(--li,0) * var(--rv-step))}
  .rv-pre .rv-img>img,.rv-pre.rv-img>img,
  .rv-pre .rv-img>video,.rv-pre.rv-img>video{opacity:0}
  .rv-in  .rv-img>img,.rv-in.rv-img>img,
  .rv-in  .rv-img>video,.rv-in.rv-img>video{opacity:1;
    transition:opacity .5s linear;
    transition-delay:calc(var(--li,0) * var(--rv-step) + 320ms)}

  .rv-pre tbody tr{opacity:0;transform:translateY(10px)}
  .rv-in  tbody tr{opacity:1;transform:none;
    transition:opacity .5s var(--ease-rv),transform .5s var(--ease-rv);
    transition-delay:calc(min(var(--ri,0),13) * 45ms)}

  .rv-pre .pin{opacity:0;transform:translate(-50%,-100%) translateY(-10px) scale(calc(var(--pz,1) * .8))}
  .rv-in  .pin{opacity:1;transform:translate(-50%,-100%) scale(var(--pz,1));
    transition:opacity .45s var(--ease-rv),transform .55s var(--ease-rv);
    transition-delay:calc(min(var(--li,0),22) * 26ms + 280ms)}
}

/* ============================================================
   Preloader — the mark's terrain bands settle into the disc,
   the wordmark wipes in beside them, a hairline tracks the real
   load, then the whole lockup flies into the header.
   ============================================================ */
/* ---- preloader -----------------------------------------------------
   A hairline drawing itself across the top of the sheet and a number
   counting under it. Nothing else: the site itself is the reveal, and
   a logo held up for two seconds only delays it.
   -------------------------------------------------------------------- */
.veil{position:fixed;inset:0;z-index:120;background:var(--paper);
  transition:opacity .6s var(--ease-rv)}
.veil[hidden]{display:none}
.veil.gone{opacity:0;pointer-events:none}
.veil-rule{position:absolute;inset-block-start:0;inset-inline-start:0;
  height:1.5px;width:0;background:var(--ink);will-change:width}
.veil-num{position:absolute;inset-block-end:clamp(18px,2.6vh,34px);
  inset-inline-start:clamp(16px,2vw,30px);direction:ltr;
  font:400 clamp(11px,.78vw,14px)/1 var(--mono);letter-spacing:.06em;
  color:var(--ink);font-variant-numeric:tabular-nums}
.veil.lift .veil-num{opacity:0;transition:opacity .28s linear}

@media (prefers-reduced-motion:reduce){ .veil{transition:none} }


/* ============================================================
   Inner pages — vision, team, about, join us, job, article
   ============================================================ */
.band{position:relative;width:100%;height:clamp(180px,28.5vw,548px);overflow:hidden;background:var(--vind-20)}
.band img{width:100%;height:100%;object-fit:cover}
.band-title{position:absolute;inset-block-end:clamp(16px,2.2vw,40px);inset-inline-start:var(--gutter);
  font-weight:300;font-size:var(--t-display);line-height:1.2;letter-spacing:-.46px;color:var(--vind-text)}

.page-head{padding-block:clamp(36px,4vw,80px) clamp(20px,2.4vw,40px);display:grid;gap:18px;justify-items:start}

/* principle rows (vision) */
.rows{display:grid}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:40px;
  padding-block:clamp(26px,3vw,60px);border-top:1px solid var(--vind-20);align-items:start}
.prow:first-child{border-top:0}

}

/* people grid (team) */
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 30px}

/* card grids (about) */

/* timeline (join us) */
.tl{position:relative;display:grid;gap:clamp(24px,3vw,56px);padding-block:10px}

  background:var(--vind-light-b);border:1px solid var(--vind-medium);transform:translate(50%,-50%)}
.tl-row .ph{width:100%;aspect-ratio:660/440;background:var(--vind-20);object-fit:cover;display:block}
.tl-row .txt{display:grid;gap:10px;justify-items:start}
.tl-row:nth-child(even) .ph{order:2}
.tl-row:nth-child(even) .txt{order:1;justify-items:end;text-align:end}

/* testimonial cards (join us) */

/* base-map georeferencing — fitted to the Figma map raster (1738×883) */
const MAPFIT = {a:307.2807,b:-9904.8980,c:17176.3276,d:10545.8114,w:1738,h:883};
const ZMAX = 14;
const mercY = lat => Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180));
const toXY = p => ({x:MAPFIT.a*p.lng+MAPFIT.b, y:MAPFIT.c*-mercY(p.lat)+MAPFIT.d});
const toPx = p => { const c=toXY(p); return {x:c.x/MAPFIT.w*100, y:c.y/MAPFIT.h*100}; };

/* zoom far enough that the group genuinely comes apart — at least three
   pieces, or no piece holding more than half of what was there */
function zoomToSplit(members,from){
  const n=members.length, cap=Math.max(1,Math.ceil(n*0.5));
  for(let z=Math.max(from,1)*1.25; z<=ZMAX; z*=1.25){
    const g=clusterPins(members,z);
    const biggest=Math.max(...g.map(c=>c.items.length));
    if(g.length>=3 || biggest<=cap) return Math.min(ZMAX,z);
  }
  return ZMAX;
}

/* pins that sit closer than a pin's width at the current zoom merge into a
   cluster pin — the "Pin=group" variant from the component set */
function clusterPins(items,zoom){
  /* merge only when two pins would actually overlap on screen at this zoom */
  const shown=state.stageW||1738;
  const R=(MAPFIT.w/shown)*38/zoom;
  const pts=items.map(p=>({p,...toXY(p)})), taken=new Array(pts.length).fill(false), out=[];
  pts.forEach((a,i)=>{
    if(taken[i]) return;
    taken[i]=true; const g=[a];
    pts.forEach((b,j)=>{
      if(taken[j]||j===i) return;
      if(Math.hypot(a.x-b.x,a.y-b.y)<R){ taken[j]=true; g.push(b); }
    });
    out.push({items:g.map(o=>o.p),
      x:g.reduce((t,o)=>t+o.x,0)/g.length, y:g.reduce((t,o)=>t+o.y,0)/g.length,
      x0:Math.min(...g.map(o=>o.x)), x1:Math.max(...g.map(o=>o.x)),
      y0:Math.min(...g.map(o=>o.y)), y1:Math.max(...g.map(o=>o.y))});
  });
  return out;
}

/* An index rather than a data table: five columns, hairline rules, and
   the picture carried by the cursor instead of a thumbnail in every row.
   The nine-column version with a tooltip on each cell asked the reader to
   work; this asks them to scan. Sorting still hangs off data-col. */
function listHTML(items){
  const cols=[['year','שנה'],['title','פרויקט'],['place','מיקום'],['plan','סוג'],['size','קנה מידה']];
  return `<div class="windex rv" id="windex">
    <div class="windex-head">${cols.map(c=>`<span class="sortable" data-col="${c[0]}">${c[1]}</span>`).join('')}</div>

      <span class="wx-title">${esc(p.title)}</span>

}

    const x=(g.x/MAPFIT.w*100).toFixed(3), y=(g.y/MAPFIT.h*100).toFixed(3);

/* ============================================================
   Reveal engine — masked line reveals and colour-block image
   wipes, in the spirit of the reference site. Purely additive:
   with JS off or reduced motion on, nothing is ever hidden.
   ============================================================ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LINE_SEL = 'h2.t-display, p.t-display, h3.t-title, .cslide h3, .cslide .place, .card h3, .card .place, .mappanel h4, .mappanel .place';
const ITEM_SEL = '.link-btn, .t-body, .attrs, figcaption, .plan, .chip-holder, .count, .reset, .view-btn, .pchips, .pspecs, .pdesc, .pcta, .ft-meta, .brand, .mapsearch, .mapzoom, .mapnote';
let revealIO=null, revealTimer=null, firstPaint=true;

function splitLines(el){
  if(!el.dataset.split && el.children.length) return;
  const text=el.dataset.raw || (el.textContent||'').replace(/\s+/g,' ').trim();
  if(!text) return;
  el.dataset.raw=text; el.dataset.split='1';
  el.innerHTML = text.split(' ').map(w=>`<span class="w">${esc(w)}</span>`).join(' ');
  const words=[...el.querySelectorAll('.w')];
  const lines=[]; let top=null, cur=null;
  words.forEach(w=>{
    const t=Math.round(w.offsetTop);
    if(top===null || Math.abs(t-top)>2){ top=t; cur=[]; lines.push(cur); }
    cur.push(w.textContent);
  });
  el.innerHTML = lines.map((l,i)=>`<span class="ln" style="--li:${i}"><i>${esc(l.join(' '))}</i></span>`).join('');
}

function makeRevealIO(){
  return new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ showUnit(e.target); revealIO.unobserve(e.target); } });
  },{threshold:.1,rootMargin:'0px 0px -6% 0px'});
}

/* reveal just the units inside one freshly swapped block, leaving the rest alone */
function initRevealIn(scope){
  const units=[...scope.querySelectorAll('.rv')];
  if(!units.length) return;
  units.forEach(u=>{
    u.querySelectorAll(LINE_SEL).forEach(splitLines);
    let i=0;
    u.querySelectorAll(ITEM_SEL).forEach(el=>{ el.classList.add('rv-i'); el.style.setProperty('--li',i++); });
    u.querySelectorAll('.pin').forEach((el,j)=>el.style.setProperty('--li',j));
    u.classList.add('rv-pre');
  });
  if(!('IntersectionObserver' in window)){ units.forEach(showUnit); return; }
  revealIO = revealIO || makeRevealIO();
  units.forEach(u=>revealIO.observe(u));
  setTimeout(()=>units.forEach(u=>{
    const r=u.getBoundingClientRect();
    if(r.top<innerHeight && r.bottom>0) showUnit(u);
  }),1500);
}

function showUnit(u){
  u.classList.remove('rv-pre');
  u.classList.add('rv-in');
  setTimeout(()=>u.classList.remove('rv-in'),2400);
}

function initReveal(scope){
  if(REDUCED) return;
  if(scope) return initRevealIn(scope);
  /* measure lines against the real face, not the fallback */
  if(document.fonts && document.fonts.status!=='loaded'){
    let done=false;
    const run=()=>{ if(!done){ done=true; initReveal(); } };
    document.fonts.ready.then(run); setTimeout(run,700);
    return;
  }
  revealIO?.disconnect(); revealIO=null; clearTimeout(revealTimer);
  const units=[...document.querySelectorAll('.rv')];
  if(!units.length) return;

  units.forEach(u=>{
    u.querySelectorAll(LINE_SEL).forEach(splitLines);
    if(u.matches(LINE_SEL)) splitLines(u);
    let i=0;
    u.querySelectorAll(ITEM_SEL).forEach(el=>{ el.classList.add('rv-i'); el.style.setProperty('--li',i++); });
    u.querySelectorAll('.pin').forEach((el,j)=>el.style.setProperty('--li',j));
    if(firstPaint && u.getBoundingClientRect().top < innerHeight) u.classList.add('soft');
    u.classList.add('rv-pre');
  });
  firstPaint=false;

  if(!('IntersectionObserver' in window)){ units.forEach(showUnit); return; }

  revealIO=makeRevealIO();
  units.forEach(u=>revealIO.observe(u));

  /* failsafe: anything already on screen is shown even if the observer misfires */
  revealTimer=setTimeout(()=>units.forEach(u=>{
    const r=u.getBoundingClientRect();
    if(r.top<innerHeight && r.bottom>0) showUnit(u);
  }),1500);
}

/* ---------- opener ---------------------------------------------------
   Two things follow the first screen: the header drops its ground while
   the film is still uncovered, and the title drifts up and dims as the
   page closes over it. The header watches the covering layer rather
   than the scroll position — the film is sticky, so its own box never
   moves and would report nothing.
   --------------------------------------------------------------------- */
let openerRAF=0, openerTick=null, openerWantClear=false;
/* the bar only goes clear once the preloader has handed the logo over —
   until then the logo needs a full-size target to fly into */
function applyHdrClear(){
  document.body.classList.toggle('hdr-clear', openerWantClear && veilDone);
}
function wireOpener(){
  if(openerTick){ removeEventListener('scroll',openerTick); removeEventListener('resize',openerTick); openerTick=null }
  const over=document.querySelector('.over'), txt=document.getElementById('opener-txt');
  if(!over){ openerWantClear=false; applyHdrClear(); return }
  const film=document.getElementById('hero-film');

  /* The film is scaled past its frame with the bottom-right corner pinned,
     so all the slack sits above the top edge — it can be pushed DOWN by up
     to (SCALE-1) of the frame height before the top edge would show. Drift
     a fraction of that and the film lags the scroll without ever exposing
     its edge. */
  const SCALE=1.16, DRIFT=0.09, ZOOM=0.012;

  const HDR=110;                       /* the bar's own height, plus a little */
  const step=()=>{
    openerRAF=0;
    /* measure the covering layer, not the film: the film is sticky, so
       its own box never moves and would report nothing */
    openerWantClear = over.getBoundingClientRect().top > HDR;
    applyHdrClear();
    const p=Math.min(1,Math.max(0,scrollY/(innerHeight||1)));
    if(txt && !REDUCED){
      txt.style.transform=`translateY(${-p*90}px)`;
      txt.style.opacity=String(1-Math.min(1,p*1.45));
    }
    if(film && !REDUCED){
      film.style.transform=
        `translate3d(0,${(p*DRIFT*innerHeight).toFixed(1)}px,0) scale(${(SCALE+p*ZOOM).toFixed(4)})`;
    }
  };
  const cue=document.getElementById('opener-scroll');
  if(cue) cue.addEventListener('click',()=>{
    scrollTo({top:innerHeight-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdr-h'))||0),
      behavior:REDUCED?'auto':'smooth'});
  });

  openerTick=()=>{ if(!openerRAF) openerRAF=requestAnimationFrame(step) };
  addEventListener('scroll',openerTick,{passive:true});
  addEventListener('resize',openerTick,{passive:true});
  step();
}
function refresh(reveal=false){ const y=scrollY; render(reveal); scrollTo(0,y); }
function go(page){
  state.page=page; state.selected=null;
  if(page==='projects'){                    /* always arrive at the whole set, as a gallery */
    state.view='grid'; state.plan='all'; state.sort='recent'; state.recent=false;
    state.f={status:[],size:[],domain:[],region:[]};
    state.zoom=1; state.pan={x:0,y:0};

  closeMenu(); render(); scrollTo(0,0);
}

/* the hero film plays once and then holds its last frame */
let filmPlayed=false, veilDone=false;
function wireFilm(){
  const film=document.getElementById('hero-film'); if(!film) return;
  film.addEventListener('ended',()=>{ filmPlayed=true; film.pause(); },{once:true});
  if(filmPlayed){                       /* coming back to the page keeps the closing frame */
    const hold=()=>{ try{ film.currentTime=Math.max(0,(film.duration||0)-0.04); }catch(e){} };
    film.readyState>=1 ? hold() : film.addEventListener('loadedmetadata',hold,{once:true});
    return;
  }
  if(REDUCED) return;                   /* no autoplay when motion is reduced — the poster stands in */
  film._start=()=>{ film.play().catch(()=>{}); };
  if(veilDone) film._start();
}
function startFilm(){
  const film=document.getElementById('hero-film');
  if(film && film._start && !filmPlayed) film._start();
}
/* browsers suspend media in a hidden tab — pick the opening back up on return */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) startFilm(); });

/* ---------- carousels: drag to scroll, arrows step one card ---------- */
function wireCarousels(){
  document.querySelectorAll('[data-crsl]').forEach(wrap=>{
    const el=wrap.querySelector('.carousel');
    const prev=wrap.querySelector('.cbtn.prev'), next=wrap.querySelector('.cbtn.next');

    /* park the arrows on the middle of the image, not the whole card */
    const place=()=>{
      const shot=el.querySelector('.shot');
      if(shot) wrap.querySelectorAll('.cbtn').forEach(b=>b.style.height=shot.offsetHeight+'px');
    };
    place(); addEventListener('resize',place,{passive:true});

    /* Loop. The reference rotates its slides so there is always a card
       either side of the middle one — at rest it shows 106px of image on
       the left, 847 in the middle and 106 on the right. Ours ran out at
       the first card and showed white. A clone of the last card sits
       before the first and a clone of the first after the last; settling
       on a clone silently re-centres its twin, which is invisible because
       the twin is the same picture. */
    const cards=[...el.querySelectorAll('.cslide')];
    let looped=false;
    if(cards.length>1 && !el.querySelector('[data-clone]')){
      const head=cards[0].cloneNode(true), tail=cards[cards.length-1].cloneNode(true);
      head.dataset.clone='first'; tail.dataset.clone='last';
      [head,tail].forEach(c=>{
        c.classList.remove('rv');
        c.querySelectorAll('.rv,.rv-img').forEach(x=>x.classList.remove('rv','rv-img'));
        c.removeAttribute('style');
      });
      el.insertBefore(tail, cards[0]);
      el.appendChild(head);
      looped=true;
      const home=()=>cards[0].scrollIntoView({inline:'center',block:'nearest',behavior:'auto'});
      requestAnimationFrame(home); addEventListener('resize',home,{passive:true});
    }

    const mid=()=>{const b=el.getBoundingClientRect();return b.left+b.width/2};
    const atMiddle=()=>[...el.querySelectorAll('.cslide')]
      .find(x=>{const r=x.getBoundingClientRect();return Math.abs((r.left+r.width/2)-mid())<r.width*0.5});
    let settle;
    if(looped) el.addEventListener('scroll',()=>{
      clearTimeout(settle);
      settle=setTimeout(()=>{
        const here=atMiddle();
        if(!here || !here.dataset.clone) return;
        const reals=[...el.querySelectorAll('.cslide:not([data-clone])')];
        const twin = here.dataset.clone==='first' ? reals[0] : reals[reals.length-1];
        twin.scrollIntoView({inline:'center',block:'nearest',behavior:'auto'});
      },140);
    },{passive:true});

    /* RTL scrollLeft runs 0 → -max; normalise to a 0 → max progress */
    const maxScroll=()=>el.scrollWidth-el.clientWidth;
    const pos=()=>Math.abs(el.scrollLeft);
    const sync=()=>{
      if(looped){ if(prev) prev.disabled=false; if(next) next.disabled=false; return }
      const m=maxScroll();
      if(prev) prev.disabled = pos()<=2 || m<2;      /* already at the first card */
      if(next) next.disabled = pos()>=m-2 || m<2;    /* nothing further along the track */
    };
    el.addEventListener('scroll',sync,{passive:true});
    setTimeout(sync,60); addEventListener('resize',sync,{passive:true});

    const gap=()=>parseFloat(getComputedStyle(el).columnGap)||30;
    wrap.querySelectorAll('.cbtn').forEach(btn=>btn.addEventListener('click',e=>{
      e.preventDefault(); e.stopPropagation();
      const card=el.querySelector('.cslide');
      const step=(card?card.offsetWidth:el.clientWidth*.6)+gap();
      el.scrollBy({left:Number(btn.dataset.step)*step,behavior:'smooth'});
    }));

    /* a half-visible neighbour is a target, not a link: the first click
       brings it to the middle, only a click on the centred card opens it */
    const centred=card=>{
      const c=el.getBoundingClientRect(), r=card.getBoundingClientRect();
      return Math.abs((r.left+r.width/2)-(c.left+c.width/2)) < r.width*0.25;
    };
    el.addEventListener('click',e=>{
      const card=e.target.closest('.cslide');
      if(!card || centred(card)) return;
      e.preventDefault(); e.stopPropagation();
      card.scrollIntoView({inline:'center',block:'nearest',behavior:REDUCED?'auto':'smooth'});
    },true);

    let down=false,x0=0,s0=0,moved=0;
    el.addEventListener('pointerdown',e=>{
      if(e.target.closest('.cbtn')) return;
      down=true;moved=0;x0=e.clientX;s0=el.scrollLeft;el.classList.add('dragging');el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove',e=>{if(!down)return;const d=e.clientX-x0;moved=Math.max(moved,Math.abs(d));el.scrollLeft=s0-d});
    const up=()=>{down=false;el.classList.remove('dragging')};
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    el.addEventListener('click',e=>{ if(moved>6){e.preventDefault();e.stopPropagation();} },true);
  });
}

/* ---------- projects index: the preview rides the pointer ----------
   One element reused by every row rather than a thumbnail in each: it
   follows the cursor inside the index and swaps its picture to whichever
   row is under it. Clamped to the index box so it never hangs off-page.
   ------------------------------------------------------------------- */
function wireIndexPreview(){
  const wrap=document.getElementById('windex'); if(!wrap || REDUCED) return;
  const pv=document.getElementById('windex-preview'); if(!pv) return;
  const img=pv.querySelector('img');
  let raf=0, x=0, y=0, on=false;

  const draw=()=>{
    raf=0;
    const b=wrap.getBoundingClientRect();
    const w=pv.offsetWidth, h=pv.offsetHeight;
    /* inside the index, and clear of the pointer itself */
    const nx=Math.min(Math.max(x-b.left+24, 0), Math.max(0, b.width  - w));
    const ny=Math.min(Math.max(y-b.top-h/2, 0), Math.max(0, b.height - h));
    pv.style.transform=`translate3d(${nx.toFixed(1)}px,${ny.toFixed(1)}px,0)`;
  };

  wrap.addEventListener('pointermove',e=>{
    const row=e.target.closest('.windex-row');
    if(!row){ if(on){ on=false; pv.classList.remove('on') } return }
    if(img.getAttribute('src')!==row.dataset.shot){
      img.src=row.dataset.shot;
      pv.classList.toggle('tall', !!row.dataset.tall);
    }
    if(!on){ on=true; pv.classList.add('on') }
    x=e.clientX; y=e.clientY;
    if(!raf) raf=requestAnimationFrame(draw);
  },{passive:true});
  wrap.addEventListener('pointerleave',()=>{ on=false; pv.classList.remove('on') },{passive:true});
}

/* ---------- map: real Google map when a key is present, raster otherwise ---------- */
let gmapLoaded=false, googleBlocked=false, gmapError='';

function mapKey(){
  if(GOOGLE_MAPS_KEY) return GOOGLE_MAPS_KEY;
  try{ return localStorage.getItem('cv_gmaps_key') || ''; }catch(e){ return ''; }
}

function wireMap(){
  const box=document.getElementById('mapbox'); if(!box) return;
  const stage=document.getElementById('mapstage');
  const note=document.getElementById('mapnote');

  if(mapKey() && !googleBlocked){ mountGoogle(box); return; }

  if(note){
    note.hidden=false;
    note.textContent = gmapError
      ? 'Google Maps נחסם מהדומיין הזה — מוצג תצריף המפה. לחצו להזנת מפתח אחר'
      : 'תצריף מפה — לחצו כדי לחבר מפת Google חיה';
  }

  /* raster fallback — drag to pan, wheel and buttons to zoom */
  let down=false,x0=0,y0=0,tx=state.pan.x,ty=state.pan.y,px=0,py=0;
  const clamp=()=>{
    const lx=stage.clientWidth*(state.zoom-1)/2, ly=stage.clientHeight*(state.zoom-1)/2;
    tx=Math.max(-lx,Math.min(lx,tx)); ty=Math.max(-ly,Math.min(ly,ty));
  };
  const apply=()=>{
    clamp();
    stage.style.transform=`scale(${state.zoom}) translate(${tx/state.zoom}px,${ty/state.zoom}px)`;
    stage.style.setProperty('--pz',(1/state.zoom).toFixed(4));   /* pins keep their size */
    state.pan.x=tx; state.pan.y=ty;
  };
  state.stageW=stage.clientWidth;
  addEventListener('resize',()=>{ state.stageW=stage.clientWidth; },{passive:true});
  stage._panTo=(fx,fy)=>{
    tx=-state.zoom*(fx*stage.clientWidth-stage.clientWidth/2);
    ty=-state.zoom*(fy*stage.clientHeight-stage.clientHeight/2);
    apply();
  };
  apply();
  stage.addEventListener('pointerdown',e=>{
    if(e.target.closest('.pin,.mapcard')) return;
    down=true;x0=e.clientX;y0=e.clientY;px=tx;py=ty;stage.classList.add('dragging');stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove',e=>{ if(!down)return; tx=px+e.clientX-x0; ty=py+e.clientY-y0; apply(); });
  const up=()=>{down=false;stage.classList.remove('dragging')};
  stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
  box.addEventListener('wheel',e=>{
    /* the project panel owns its own scroll — never steal the wheel from it */
    if(e.target.closest('.mappanel')) return;
    /* on the home page the map is a section, not the content: let the page scroll past it.
       zoom there only with ctrl/⌘, the way an embedded map behaves. */
    const mapIsTheContent = state.page==='projects' && state.view==='map';
    if(!mapIsTheContent && !(e.ctrlKey||e.metaKey)) return;
    /* while a project drawer is open the map is its backdrop, not the
       thing being read — zooming under an open panel moves the pin the
       panel is about out from under it */
    if(state.selected) return;
    e.preventDefault();
    state.zoom=Math.min(ZMAX,Math.max(1,state.zoom*(e.deltaY<0?1.18:1/1.18)));
    apply();
    clearTimeout(stage._rz); stage._rz=setTimeout(repaintPins,260);  /* re-cluster when the gesture settles */
  },{passive:false});
  stage._applyZoom=apply;
}

function mountGoogle(box){
  const host=box.querySelector('#gmap');
  const note=box.querySelector('#mapnote');
  if(note) note.hidden=true;
  host.hidden=false;
  box.querySelector('#mapstage').style.visibility='hidden';
  box.querySelector('#mapzoom').style.display='none';

  const draw=()=>{
    const items = state.page==='projects' ? visible() : P;
    const map=new google.maps.Map(host,{
      center:{lat:31.72,lng:34.95}, zoom:8,
      mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
      zoomControl:true, zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_BOTTOM},
      styles:[
        {elementType:'labels.icon',stylers:[{visibility:'off'}]},
        {featureType:'poi',stylers:[{visibility:'off'}]},
        {featureType:'transit',stylers:[{visibility:'off'}]},
        {elementType:'geometry',stylers:[{saturation:-90},{lightness:10}]},
        {featureType:'water',elementType:'geometry',stylers:[{color:'#e8ecef'}]},
        {featureType:'road',elementType:'geometry',stylers:[{color:'#ffffff'}]}
      ]
    });
    const info=new google.maps.InfoWindow();
    const bounds=new google.maps.LatLngBounds();
    items.forEach(p=>{
      const pos={lat:p.lat,lng:p.lng};
      bounds.extend(pos);
      const m=new google.maps.Marker({position:pos,map,title:p.title,
        icon:{url:pinSrc(p),scaledSize:new google.maps.Size(33,43),anchor:new google.maps.Point(16,43)}});
      m.addListener('click',()=>{
        info.setContent(
          `<div style="direction:rtl;text-align:right;font-family:SimplerPro_V3,sans-serif;max-width:270px;padding:2px 4px 6px">
             <div style="font:300 21px/1.25 SimplerPro_V3,sans-serif;color:#302620;letter-spacing:.2px">${esc(p.title)}</div>
             <div style="font-size:15px;color:#6B5A48;margin-top:2px">${esc(p.place)}</div>
             <div style="font-size:13px;color:#7A3A20;margin-top:8px">${PLAN[p.plan].label} · ${DOMAIN[p.domain].label} · ${SIZE[p.size].label}</div>
           </div>`);
        info.open({anchor:m,map});
      });
    });
    if(items.length>1) map.fitBounds(bounds,{top:40,right:40,bottom:40,left:40});
  };

  if(gmapLoaded && window.google?.maps) return draw();
  if(document.getElementById('gmaps-sdk')) return;

  const fail=(msg)=>{ gmapError=msg||'blocked'; googleBlocked=true; refresh(); };
  const timer=setTimeout(()=>{ if(!window.google?.maps) fail('timeout'); },6000);
  window.__cvMapReady=()=>{ gmapLoaded=true; clearTimeout(timer); draw(); };
  window.gm_authFailure=()=>{ clearTimeout(timer); try{localStorage.removeItem('cv_gmaps_key')}catch(e){} fail('auth'); };

  const sc=document.createElement('script');
  sc.id='gmaps-sdk';
  sc.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(mapKey())}&callback=__cvMapReady&language=he&region=IL&loading=async`;
  sc.async=true;
  sc.onerror=()=>{ clearTimeout(timer); sc.remove(); fail('blocked'); };
  document.head.appendChild(sc);
}

/* ---------- one delegated handler ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const nav=t.closest('[data-nav]');
  if(nav){e.preventDefault();go(nav.dataset.nav);return}
  if(t.closest('[data-soon]')){e.preventDefault();closeMenu();return}

  const lang=t.closest('#lang-he,#lang-en');
  if(lang){
    document.getElementById('lang-he').setAttribute('aria-pressed',String(lang.id==='lang-he'));
    document.getElementById('lang-en').setAttribute('aria-pressed',String(lang.id==='lang-en'));
    return;
  }
  const job=t.closest('[data-job]');
  if(job){ state.job=Number(job.dataset.job); go('job'); return }

  const ex=t.closest('[data-ex]');
  if(ex){ ex.closest('.prow')?.classList.toggle('open'); return }

  if(t.closest('[data-mapkey]')){
    const k=prompt('מפתח Google Maps JavaScript API:\n(נשמר בדפדפן שלכם בלבד)');
    if(k&&k.trim()){ try{localStorage.setItem('cv_gmaps_key',k.trim())}catch(e){} googleBlocked=false; gmapError=''; refresh(); }
    return;
  }

  const clear=t.closest('[data-clear]');
  if(clear){e.preventDefault();e.stopPropagation();state.f[clear.dataset.clear]=[];refresh();return}

  const pop=t.closest('[data-pop]');
  if(pop){const panel=pop.parentElement.querySelector('.pop');const open=!panel.classList.contains('open');closePops(panel);panel.classList.toggle('open',open);return}

  const opt=t.closest('[data-filter]');
  if(opt){
    const g=opt.dataset.filter,v=opt.dataset.val,arr=state.f[g],i=arr.indexOf(v);
    i>-1?arr.splice(i,1):arr.push(v);
    refresh();
    document.querySelector(`.pop[data-popfor="${g}"]`)?.classList.add('open');
    return;
  }
  if(t.closest('[data-recent]')){ state.recent=!state.recent; state.selected=null; refresh(); return }
  const sort=t.closest('[data-sort]'); if(sort){state.sort=sort.dataset.sort;refresh();return}
  const plan=t.closest('[data-plan]'); if(plan){state.plan=plan.dataset.plan;state.selected=null;refresh();return}
  const view=t.closest('[data-view]'); if(view){ setView(view.dataset.view); return }
  if(t.closest('#reset')){state.f={status:[],size:[],domain:[],region:[]};state.plan='all';state.recent=false;refresh();return}

  const col=t.closest('[data-col]');
  if(col){const m={year:'recent',title:'alpha',units:'scale'};state.sort=m[col.dataset.col]||(state.sort==='recent'?'oldest':'recent');refresh();return}

  if(t.closest('[data-pin-close]')){ selectProject(null); return }
  const pin=t.closest('[data-pin]'); if(pin){ selectProject(Number(pin.dataset.pin)); return }

  const cluster=t.closest('[data-cluster]');
  if(cluster){
    const [fx,fy]=cluster.dataset.cluster.split(',').map(v=>Number(v)/100);
    const ids=new Set((cluster.dataset.ids||'').split(',').map(Number));
    const members=P.filter(p=>ids.has(p.id));
    state.zoom = members.length>1 ? zoomToSplit(members,state.zoom) : Math.min(ZMAX,state.zoom*1.6);
    const stage=document.getElementById('mapstage');
    if(stage && stage._panTo){ stage._panTo(fx,fy); clearTimeout(stage._rp); stage._rp=setTimeout(repaintPins,480); }
    else refresh();
    return;
  }

  const zoom=t.closest('[data-zoom]');
  if(zoom){
    if(state.selected) return;            /* locked while the drawer is open */
    const dir=Number(zoom.dataset.zoom);
    state.zoom=Math.min(ZMAX,Math.max(1,state.zoom*(dir>0?1.55:1/1.55)));
    const stage=document.getElementById('mapstage');
    if(stage && stage._applyZoom){ stage._applyZoom(); clearTimeout(stage._rp); stage._rp=setTimeout(repaintPins,480); }
    else refresh();
    return;
  }
  const card=t.closest('[data-project]');
  if(card){ e.preventDefault(); state.project=Number(card.dataset.project); go('project'); return }

  if(t.closest('[data-more]')){ document.getElementById('pj-copy')?.classList.toggle('open');
    const b=t.closest('[data-more]'); const open=document.getElementById('pj-copy')?.classList.contains('open');
    b.querySelector('i').textContent = open?'−':'+';
    b.querySelector('span').textContent = open?'הצג פחות':'קרא עוד';
    return; }
});

/* ---------- preloader ---------- */
const veil=document.getElementById('veil');
function runVeil(){
  if(!veil) return Promise.resolve();
  const bar=document.getElementById('veil-bar'), num=document.getElementById('veil-num');
  let shown=0;
  const paint=n=>{
    n=Math.max(shown,Math.min(100,n));   /* a loading number never goes backwards */
    shown=n;
    if(bar) bar.style.width=n+'%';
    if(num) num.textContent=String(Math.round(n));
  };
  if(REDUCED){ paint(100); return Promise.resolve(); }

  /* the line tracks what has actually arrived, not a fake timer */
  const assets=[...document.images].filter(i=>i.getAttribute('loading')!=='lazy');
  let done=0;
  const tick=()=>{ done++; paint(done/Math.max(assets.length,1)*100); };
  assets.forEach(i=>i.complete?tick():(i.addEventListener('load',tick,{once:true}),
                                       i.addEventListener('error',tick,{once:true})));
  if(!assets.length) paint(100);

  /* creep forward while nothing is landing, so the count never stalls */
  const creep=setInterval(()=>paint(shown+(96-shown)*0.06),110);

  const ready=new Promise(r=>{ document.readyState==='complete' ? r() : addEventListener('load',r,{once:true}); });
  const floor=new Promise(r=>setTimeout(r,900));     /* long enough to read */
  const ceiling=new Promise(r=>setTimeout(r,3200));  /* never hold the page hostage */
  return Promise.race([Promise.all([ready,floor]),ceiling])
    .then(()=>{ clearInterval(creep); paint(100); return new Promise(r=>setTimeout(r,260)); });
}

/* lift the sheet and let the film through */
function liftVeil(){
  if(!veil) return;
  document.body.classList.remove('booting');
  document.body.classList.add('booted');
  veil.classList.add('lift');
  veilDone=true; startFilm(); applyHdrClear();
  veil.classList.add('gone');
  setTimeout(()=>{ veil.hidden=true },700);
}

if('scrollRestoration' in history) history.scrollRestoration='manual';
if(!REDUCED) document.body.classList.add('booting');
render();
runVeil().then(liftVeil);

addEventListener('resize',()=>{

/* ---------- inertial scroll -----------------------------------------
   The wheel sets a destination rather than a position, and the page
   eases toward it — so a flick glides to rest instead of stopping dead,
   and the film underneath drifts rather than jerks. Same idea as Lenis,
   written out here so the site keeps no CDN dependency.

   Anything with its own scrolling — the map, its panel, the menu — is
   left to the browser, as is a pinch or a ⌘-wheel.
   -------------------------------------------------------------------- */
(function(){
  if(REDUCED || !matchMedia('(hover:hover) and (pointer:fine)').matches) return;

  const OWN='#mapbox,.mappanel,.pscroll,.menu,.carousel,select,textarea,[data-native-scroll]';
  const LERP=0.105;                    /* how fast the page catches its target */
  let target=scrollY, current=scrollY, raf=0, driving=false;

  /* the sheet asks for scroll-behavior:smooth, which makes every write
     below start a native animation that the next frame replaces before
     it arrives — the two easings fight and the page crawls. From here
     on this loop is the only thing easing the page. */
  document.documentElement.style.scrollBehavior='auto';
  const put=y=>scrollTo({top:y,left:0,behavior:'instant'});

  const limit=()=>Math.max(0,document.documentElement.scrollHeight-innerHeight);
  const clamp=v=>Math.max(0,Math.min(limit(),v));

  function frame(){
    const d=target-current;
    if(Math.abs(d)<0.4){
      current=target; driving=false; raf=0;
      put(Math.round(current));
      return;
    }
    current+=d*LERP;
    put(Math.round(current));
    raf=requestAnimationFrame(frame);
  }

  addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey||e.defaultPrevented) return;
    if(e.target.closest && e.target.closest(OWN)) return;
    e.preventDefault();
    if(!driving){ target=current=scrollY; driving=true; }
    target=clamp(target + e.deltaY*(e.deltaMode===1?18:e.deltaMode===2?innerHeight:1));
    if(!raf) raf=requestAnimationFrame(frame);
  },{passive:false});

  /* keyboard, scrollbar, and the router's own jumps all move the page
     without us — adopt wherever they left it */
  addEventListener('scroll',()=>{ if(!driving) target=current=scrollY },{passive:true});
  addEventListener('resize',()=>{ if(!driving) target=current=scrollY },{passive:true});
})();
</script>
